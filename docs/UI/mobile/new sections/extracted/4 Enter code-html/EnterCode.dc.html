<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter code</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#0F0F12;background:radial-gradient(90% 34% at 12% 0%, rgba(86,92,255,0.75) 0%, rgba(86,92,255,0) 75%), radial-gradient(70% 26% at 100% 4%, rgba(255,160,186,0.9) 0%, rgba(255,160,186,0) 75%), linear-gradient(180deg,#C9CBFF 0%,#EEF0FF 24%,#FFFFFF 44%,#FFFFFF 100%)">

<div style="position:absolute;left:20px;right:20px;top:56px;display:flex;align-items:center;justify-content:space-between">
<a href="Connect.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(40,40,160,0.18)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F0F12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<a href="SkipConfirm.dc.html" style="height:44px;padding:0 12px;display:flex;align-items:center;font-size:16px;font-weight:700;color:#0F0F12">Skip</a>
</div>

<div style="position:absolute;left:32px;right:32px;top:116px;text-align:center">
<h1 style="margin:0;font-size:40px;line-height:1.04;font-weight:800;letter-spacing:-0.045em;color:#2D2DEB">Enter<br>your code</h1>
<p style="margin:12px auto 0;max-width:300px;font-size:16px;line-height:1.45;color:#16161C">Find the 6-digit code in <b>Settings</b>, then <b>Phone</b>, on your PC.</p>
</div>

<div style="position:absolute;left:24px;right:24px;top:300px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="6">
<div style="height:64px;box-sizing:border-box;border-radius:16px;background:#fff;border:{{cell.border}};display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#0F0F12;box-shadow:0 6px 16px rgba(45,45,235,0.08)">{{cell.ch}}</div>
</sc-for>
</div>
<div style="position:absolute;left:24px;right:24px;top:376px;text-align:center;font-size:13px;color:#3A3C47" aria-live="polite">{{count}} of 6 digits</div>

<div style="position:absolute;left:24px;right:24px;top:414px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{keys}}" as="key" hint-placeholder-count="12">
<div style="height:52px">
<sc-if value="{{key.isDigit}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ key.press }}" style="width:100%;height:52px;border:0;border-radius:16px;background:#F1F2FD;color:#0F0F12;font-size:22px;font-weight:600">{{key.label}}</button>
</sc-if>
<sc-if value="{{key.isDelete}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Delete" onClick="{{ key.press }}" style="width:100%;height:52px;border:0;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F0F12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="M12 9.5l5 5M17 9.5l-5 5"></path></svg>
</button>
</sc-if>
</div>
</sc-for>
</div>

<div style="position:absolute;left:24px;right:24px;bottom:44px;display:flex;flex-direction:column;align-items:center;gap:6px">
<a href="Today.dc.html" aria-disabled="{{notReady}}" style="box-sizing:border-box;width:100%;height:56px;border-radius:14px;background:{{btnBg}};color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;box-shadow:{{btnShadow}}">Connect</a>
<a href="Connect.dc.html" style="height:44px;padding:0 20px;display:flex;align-items:center;color:#0F0F12;font-size:16px;font-weight:700">Scan code instead</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const code = (this.state && this.state.code != null) ? this.state.code : '438';
const press = (d) => () => {
const c = (this.state && this.state.code != null) ? this.state.code : '438';
if (c.length < 6) this.setState({ code: c + d });
};
const del = () => {
const c = (this.state && this.state.code != null) ? this.state.code : '438';
this.setState({ code: c.slice(0, -1) });
};
const cells = [0, 1, 2, 3, 4, 5].map((i) => ({
ch: code[i] || '',
border: i === code.length ? '2px solid #2D2DEB' : '2px solid #D3D6F4'
}));
const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => ({ label: d, isDigit: true, isDelete: false, press: press(d) }));
keys.push({ label: '', isDigit: false, isDelete: false, press: null });
keys.push({ label: '0', isDigit: true, isDelete: false, press: press('0') });
keys.push({ label: '', isDigit: false, isDelete: true, press: del });
const ready = code.length === 6;
return {
cells,
keys,
count: code.length,
notReady: !ready,
btnBg: ready ? '#2D2DEB' : '#8F91E8',
btnShadow: ready ? '0 14px 30px rgba(45,45,235,0.35)' : 'none'
};
}
}
</script>
</body>
</html>
