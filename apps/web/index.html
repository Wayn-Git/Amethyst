<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <link rel="mask-icon" href="/logo.svg" color="#873FFF" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https: http:; media-src * blob: data:; font-src * data:; style-src * 'unsafe-inline';" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0c11" media="(prefers-color-scheme: dark)" />
  <meta name="description"
    content="AMETHYST — your personal operating system. One agent over your files, shell, tasks, calendar and connected services." />
  <meta property="og:title" content="AMETHYST · Personal Operating System" />
  <meta property="og:description"
    content="One agent over your files, shell, tasks, calendar, and connected services." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="AMETHYST · Personal Operating System" />
  <meta name="twitter:description"
    content="One agent over your files, shell, tasks, calendar, and connected services." />
  <meta name="twitter:image" content="/logo.png" />
  <title>AMETHYST · personal operating system</title>
  <!-- Fonts: Inter, Newsreader, Bricolage Grotesque, Instrument Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
  <!-- The API's own preconnect is added from api.js rather than written here.
         An env placeholder that no build defined stays in the markup verbatim
         as a broken href, and the same-origin build has no second host to
         connect to at all. -->

  <style>
    :root {
      --startup-bg: #F4F6FB;
      --startup-text: #1D1D1F;
      --startup-sub: #3A3A3C;
      --startup-accent: #0071E3;
    }
    body {
      margin: 0;
      background: var(--startup-bg);
      color: var(--startup-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow-x: hidden;
    }
    [data-startup="loading"] {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      box-sizing: border-box;
      padding: 24px;
      position: relative;
      background: radial-gradient(90% 55% at 12% 100%, #FFB68A 0%, rgba(255,182,138,0) 70%),
                  radial-gradient(90% 60% at 100% 80%, #5B9BFF 0%, rgba(91,155,255,0) 70%),
                  radial-gradient(80% 50% at 50% 0%, #DCE9FF 0%, rgba(220,233,255,0) 75%),
                  #F4F6FB;
      color: #1D1D1F;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .startup-glass-badge {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.65);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .startup-crystal {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: block;
    }
    .startup-wordmark {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #1D1D1F;
    }
    .startup-sub {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(48px, env(safe-area-inset-bottom, 48px));
      text-align: center;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #3A3A3C;
      letter-spacing: -0.01em;
    }
    [data-startup="error"] {
      padding: 32px;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    [data-startup="error"] h1 {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    [data-startup="error"] p {
      color: #6E6E73;
      font-size: 14px;
      margin: 0 0 20px;
      max-width: 340px;
    }
    [data-startup="error"] button {
      font: inherit;
      padding: 12px 24px;
      border-radius: 9999px;
      border: none;
      background: #111113;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="root">
    <section data-startup="loading" role="status" aria-label="Loading Amethyst">
      <div class="startup-glass-badge">
        <svg class="startup-crystal" xmlns="http://www.w3.org/2000/svg" viewBox="524.5 524 560 560" aria-hidden="true">
          <path fill="#873FFF" d="M804 536L684 651L791 1015L768 1018L644 888L572 889L806 1072L1038 887L968 887L843 1018L819 1015L927 651Z" />
          <path fill="#873FFF" d="M1016 701L928 722L847 986L960 870L1039 846Z" />
          <path fill="#873FFF" d="M595 701L570 845L651 870L763 985L682 722Z" />
        </svg>
      </div>
      <h1 class="startup-wordmark">Amethyst</h1>
      <p class="startup-sub">One mind for your digital life.</p>
    </section>
  </div>
  <script type="module" src="/src/bootstrap.js"></script>
</body>

</html>
