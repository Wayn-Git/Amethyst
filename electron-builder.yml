appId: ai.amethyst.desktop
productName: Amethyst
copyright: Copyright © 2026 Amethyst Authors

directories:
  output: dist-desktop
  buildResources: electron/assets

files:
  - "electron/**/*"
  - "frontend/dist/**/*"
  - "package.json"

extraResources:
  - from: "resources/bin"
    to: "bin"
    filter: ["**/*"]

publish:
  provider: github
  owner: Wayn-Git
  repo: Amethyst
  releaseType: release

mac:
  icon: electron/assets/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: ["arm64", "x64"]
    - target: zip
      arch: ["arm64", "x64"]
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch: ["x64"]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico

linux:
  icon: electron/assets/icon.png
  category: Utility
  maintainer: "Amethyst Authors <dev@amethyst.ai>"
  target:
    - target: AppImage
      arch: ["x64"]
    - target: deb
      arch: ["x64"]
